<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ELMNT Health is now TERRA ELMNT. Visit our official store at terraelmnt.com or contact customer support.">
  <title>ELMNT Health</title>
  <link rel="canonical" href="https://elmnthealth.com/">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      border-top: 4px solid #958654;
      background: #faf9f5;
      color: #26271f;
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    main {
      width: 100%;
      padding: clamp(40px, 8vh, 80px) 20px;
    }
    .logo {
      width: clamp(142px, 18vw, 200px);
      height: auto;
    }
    h1 {
      margin: clamp(32px, 5vh, 52px) 0 16px;
      font-size: clamp(32px, 5vw, 62px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }
    h1 span { display: block; }
    p {
      margin: 0 auto;
      max-width: 35ch;
      color: #55564d;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.5;
      text-wrap: pretty;
    }
    .store {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 50px;
      margin-top: 28px;
      padding: 12px 22px;
      border-radius: 3px;
      background: #34372a;
      color: white;
      font-weight: 600;
      text-decoration: none;
    }
    .store:hover { background: #4d503e; }
    .support {
      display: table;
      margin: 12px auto 0;
      padding: 14px 8px;
      color: #4b4c41;
      font-size: 15px;
      text-underline-offset: 4px;
    }
    @media (max-width: 360px) {
      h1 { font-size: 27px; }
      .store { gap: 8px; padding-inline: 14px; font-size: 15px; }
    }
    a:focus-visible { outline: 3px solid #766033; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/terra-elmnt-logo.svg" width="403" height="126" alt="TERRA ELMNT">
    <h1>ELMNT Health is now <span>TERRA ELMNT</span></h1>
    <p>Our official store has moved to terraelmnt.com.</p>
    <a class="store" href="https://terraelmnt.com/">Visit the TERRA ELMNT store <span aria-hidden="true">→</span></a>
    <a class="support" href="https://terraelmnt.com/pages/help">Contact customer support</a>
  </main>
</body>
</html>
